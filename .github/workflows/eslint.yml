name: Lint Code

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inspect commited lockfiles
        working-directory: IBDC-expo
        run: |
          echo "Commit:"
          git rev-parse HEAD
          echo "Lockfile concat-map entry:"
          grep -A 5 '"node_modules/concat-map"' package-lock.json || true
          echo "brace-expansion dependency:"
          grep -A 12 '"node_modules/brace-expansion"' package-lock.json || true
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        working-directory: IBDC-expo
        run: npm ci

      - name: Diagnose dependencies
        working-directory: IBDC-expo
        run: |
          echo "Node version:"
          node --version

          echo "npm version:"
          npm --version

          echo "concat-map dependency tree:"
          npm ls concat-map --all || true

          echo "concat-map resolution:"
          node -p "require.resolve('concat-map')" || true

          echo "concat-map loading:"
          node -e "require('concat-map'); console.log('Loaded successfully')" || true

          echo "npm omit setting:"
          npm config get omit

      - name: Run ESLint
        working-directory: IBDC-expo
        run: npm run lint
